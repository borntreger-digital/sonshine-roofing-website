name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          # Select the repository npm before querying it against devEngines.
          package-manager-cache: false
      - name: Use repository npm version
        working-directory: ${{ runner.temp }}
        env:
          TOOLCHAIN_PACKAGE_JSON: ${{ github.workspace }}/package.json
        run: |
          package_manager="$(node -p 'require(process.env.TOOLCHAIN_PACKAGE_JSON).packageManager')"
          if [ "$(npm --version)" != "${package_manager#npm@}" ]; then
            npm install --global "$package_manager"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:compiler
      - name: Verify build secrets and accepted dependency policy
        run: npm run verify:build-secrets && npm run verify:audit-policy && npm run audit:policy
      - name: Typecheck
        run: npm run typecheck && npm run typecheck:compat
      - name: Verify lint rule coverage
        run: npm run verify:lint-contract
      - name: Verify Tailwind utilities
        run: npm run verify:tailwind-utilities && npm run verify:tailwind-css
      - name: Verify React hydration and restored browser state
        run: npm run verify:react-readiness
      - name: Verify resource page interactions
        run: npm run verify:resource-pages
      - name: Verify archive controls
        run: npm run verify:archive-controls
      - name: Verify content preview selection
        run: npm run verify:content-previews
      - name: Verify video playback
        run: npm run verify:video-playback
      - name: Verify Directus HTML
        run: npm run verify:directus-html
      - name: Verify CMS text extraction
        run: npm run verify:html-text
      - name: Verify public input handling
        run: npm run verify:security-input-handling
      - name: Verify public JSON body limits
        run: npm run verify:request-body-limits
      - name: Verify project pipeline
        run: npm run verify:project-pipeline
      - name: Verify editorial date rules in PostgreSQL
        run: npm run verify:editorial-dates && node scripts/location-model/verify-sql.mjs
      - name: Verify video pipeline
        run: npm run verify:video-pipeline
      - name: Verify static media metadata and rendering
        run: npm run verify:static-media
      - name: Verify location tooling and page contracts
        run: npm run verify:locations
      - name: Verify shared review carousel
        run: npm run verify:review-carousel
      - name: Verify all dynamic route contracts
        run: npm run verify:dynamic-routes
      - name: Verify interrupted build-time CMS requests
        run: npm run verify:build-fetch
      - name: Verify Directus fetch policy
        run: npm run verify:directus-fetch-policy
      - name: Verify legacy media redirect behavior
        run: npm run verify:legacy-media-redirects
      - name: Verify FAQ HTML
        run: npm run verify:faq-html
      - name: Verify person HTML
        run: npm run verify:person-html
      - name: Verify sponsor HTML
        run: npm run verify:sponsor-html
      - name: Verify person SEO
        run: npm run verify:person-seo
      - name: Verify JSON-LD serialization
        run: npm run verify:json-ld
      - name: Verify glossary HTML
        run: npm run verify:glossary-html
      - name: Verify glossary route policy
        run: npm run verify:glossary-policy
      - name: Verify special-offer content and coupon flow
        run: npm run verify:special-offer-flow && npm run verify:landing-conversions
      - name: Verify special-offer indexing
        run: npm run verify:special-offer-indexing
      - name: Verify build-only revalidation
        run: npm run verify:build-only-revalidation
      - name: Verify editorial capture and deployment source contract
        run: npm run verify:editorial-pipeline && npm run verify:deployment-contract
      - name: Verify synthetic production deployments without runtime CMS access
        run: npm run verify:deployment-builds
      - name: Verify Workers analytics policy and immutable releases
        run: npm run verify:vinext-analytics-policy && npm run verify:vinext-releases
